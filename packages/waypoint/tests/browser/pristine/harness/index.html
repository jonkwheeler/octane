<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>react-waypoint pristine browser suite</title>
		<link rel="stylesheet" href="/jasmine.css" />
		<style>
			/* Karma's iframe has no default body margin; Chromium's 8px margin
			   shifts getBoundingClientRect and breaks upstream pixel assertions. */
			html,
			body {
				margin: 0;
				padding: 0;
			}
			/*
			 * Upstream horizontal window cases delete the subject parent's width.
			 * Block-level parents stay viewport-wide, so oversized inline-block
			 * spacers overflow without growing document scrollWidth. Shrink only
			 * nowrap horizontal parents (vertical suites keep block layout).
			 */
			body > div > div[style*='white-space: nowrap'],
			body > div > div[style*='white-space:nowrap'] {
				display: inline-block;
				vertical-align: top;
			}
		</style>
		<script src="/jasmine.js"></script>
		<script src="/jasmine-boot.js"></script>
	</head>
	<body>
		<script type="module" src="/boot.js"></script>
	</body>
</html>
